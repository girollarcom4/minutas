<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Validacao de Minutas Girollar</title>
<!--
  POR QUE O ENDERECO DE DESTINO NAO ESTA NESTE ARQUIVO:

  O GitHub Pages serve esta pagina com "Cache-Control: max-age=600" -- o navegador guarda
  o HTML por 10 minutos. Se o tunel trocar de endereco nesse intervalo (e ele troca a cada
  auto-cura), a copia em cache manda o usuario para um tunel MORTO: Error 1033. Aconteceu
  de verdade no primeiro teste do usuario, em 17/08/2026.

  Por isso o destino vive em destino.json, buscado com cache-buster e no-store. Mesmo com
  este HTML vindo do cache, o endereco e sempre o atual.
-->
<style>
  :root{--bg:#f6f7f9;--fg:#1a2332;--mut:#5b6878;--card:#fff;--bd:#e3e7ec;--ac:#1e3a5f;--err:#b4232c}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1620;--fg:#e8edf4;--mut:#93a1b3;--card:#172130;--bd:#26344a;--ac:#7aa7d9;--err:#f28b93}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:var(--bg);color:var(--fg);
       font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .c{background:var(--card);border:1px solid var(--bd);border-radius:14px;
     padding:32px 28px;max-width:460px;width:100%;text-align:center}
  h1{margin:0 0 6px;font-size:1.15rem;letter-spacing:-.01em}
  p{margin:0 0 18px;color:var(--mut);font-size:.92rem}
  a.b{display:inline-block;background:var(--ac);color:#fff;text-decoration:none;
      padding:11px 22px;border-radius:8px;font-weight:600;font-size:.93rem}
  a.b[hidden]{display:none}
  .s{margin-top:20px;font-size:.75rem;color:var(--mut);word-break:break-all}
  .d{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3fa66a;margin-right:6px}
  .e{color:var(--err);font-size:.85rem}
</style>
</head>
<body>
  <div class="c">
    <h1><span class="d"></span>Validacao de Minutas</h1>
    <p id="msg">Localizando o sistema&hellip;</p>
    <a class="b" id="ir" href="#" hidden>Entrar agora</a>
    <div class="s" id="det"></div>
    <noscript>
      <p class="e">Este atalho precisa de JavaScript. Peca o endereco atual a quem administra o sistema.</p>
    </noscript>
  </div>
<script>
(function () {
  var msg = document.getElementById("msg");
  var ir  = document.getElementById("ir");
  var det = document.getElementById("det");

  fetch("destino.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (j) {
      if (!j || !j.url) throw new Error("destino vazio");
      ir.href = j.url;
      ir.hidden = false;
      msg.textContent = "Redirecionando…";
      det.textContent = "Endereco: " + j.url + (j.atualizado ? " · atualizado em " + j.atualizado : "");
      location.replace(j.url);
    })
    .catch(function (e) {
      msg.textContent = "Nao consegui localizar o sistema agora.";
      det.innerHTML =
        '<span class="e">O notebook do escritorio pode estar desligado, ou o tunel fora do ar. ' +
        "Tente de novo em alguns minutos.</span><br><br>(" + e.message + ")";
    });
})();
</script>
</body>
</html>
